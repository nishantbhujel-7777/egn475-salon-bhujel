
{% extends "base.html" %}

{% block title %}Add New Service - Bella Vista Salon{% endblock %}

{% block content %}

<h1>Add a New Salon Service</h1>

<p>
    Enter the details below to add a new service
    to Bella Vista Salon.
</p>

{% if error %}
<article>
    <strong>{{ error }}</strong>
</article>
{% endif %}

<form method="POST" action="{{ url_for('new_service') }}">

    <label for="name">Service Name</label>
    <input
        type="text"
        id="name"
        name="name"
        placeholder="Example: Hair Treatment"
        required
    >

    <label for="duration_minutes">Duration (minutes)</label>
    <input
        type="number"
        id="duration_minutes"
        name="duration_minutes"
        min="1"
        placeholder="Example: 60"
        required
    >

    <label for="price">Price ($)</label>
    <input
        type="number"
        id="price"
        name="price"
        min="0"
        step="0.01"
        placeholder="Example: 45.00"
        required
    >

    <button type="submit">
        Add Service
    </button>

</form>

<p>
    <a href="{{ url_for('services') }}">
        Back to Services
    </a>
</p>

{% endblock %}
